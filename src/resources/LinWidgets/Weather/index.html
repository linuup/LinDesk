<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget">
    <div class="glass-panel">
      <!-- Header -->
      <header class="header">
        <div class="location-container">
          <span class="location-icon" style="font-size: 1.2rem; margin-right: 0.4rem; opacity: 0.8;">📍</span>
          <input id="locationInput" type="text" placeholder="输入城市后回车..." title="点击此处修改城市" />
        </div>
        <div style="display: flex; align-items: center; gap: 0.6rem;">
          <button type="button" id="themeToggle" class="theme-toggle" title="切换主题">☀️</button>
        </div>
      </header>
      
      <!-- Weather Content Wrapper -->
      <div class="weather-content">
        <!-- Current Weather -->
        <section class="current-weather">
          <div class="current-main">
            <div class="weather-icon-wrapper">
              <div class="weather-icon" id="icon">☀️</div>
            </div>
            <div class="temp-block">
              <div class="temperature" id="temperature">--°</div>
              <div class="condition" id="condition">正在获取天气</div>
            </div>
          </div>
          
          <!-- Metrics -->
          <div class="metrics">
            <div class="metric" title="空气质量"><span class="metric-icon">🌬️</span><span id="aqi">--</span></div>
            <div class="metric" title="湿度"><span class="metric-icon">💧</span><span id="humidity">--%</span></div>
            <div class="metric" title="风速"><span class="metric-icon">🍃</span><span id="wind">--</span></div>
          </div>
        </section>
        
        <!-- Forecast -->
        <section class="forecast" id="forecast">
          <!-- Dynamically injected forecast items -->
        </section>
      </div>
    </div>

  </main>
  <script src="script.js"></script>
</body>
</html>
