<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="widget">
    <div class="glass-panel">
      <div class="header">
        <div class="coin-selector" id="coinSelector">
          <span class="coin-chip active" data-symbol="BTC-USDT" data-id="bitcoin">BTC</span>
          <span class="coin-chip" data-symbol="ETH-USDT" data-id="ethereum">ETH</span>
          <span class="coin-chip" data-symbol="SOL-USDT" data-id="solana">SOL</span>
          <span class="coin-chip" data-symbol="DOGE-USDT" data-id="dogecoin">DOGE</span>
        </div>
        <div class="change" id="changePercent">--%</div>
      </div>
      <div class="price font-mono" id="currentPrice">Loading...</div>
      <div class="canvas-wrap">
        <canvas id="trendCanvas"></canvas>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
