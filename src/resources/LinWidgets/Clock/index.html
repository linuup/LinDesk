<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="widget">
    <div class="glass-panel">
      <!-- Theme/Style Switcher Dots -->
      <div class="style-switcher">
        <button type="button" class="style-dot active" data-style="digital" title="Digital Clock"></button>
        <button type="button" class="style-dot" data-style="analog" title="Analog Clock"></button>
      </div>

      <!-- Header -->
      <header class="header">
        <button type="button" id="themeToggle" class="theme-toggle" title="切换主题">☀️</button>
      </header>
      <!-- Main Content -->
      <section class="main-clock">
        <div class="time-block">
          <div class="time-container">
            <div id="time-main" class="time-main">00:00</div>
            <div class="time-sub">
              <span id="time-sec" class="time-sec">:00</span>
              <span id="time-ampm" class="time-ampm"></span>
            </div>
          </div>
          <div class="date">
            <span id="date-full" class="date-full">Loading</span>
            <span id="date-short" class="date-short"></span>
          </div>
        </div>
      </section>

      <!-- Analog Clock -->
      <section class="analog-clock">
        <div class="clock-face">
          <div class="clock-markers" id="clockMarkers"></div>
          <div class="hand hour-hand" id="hourHand"></div>
          <div class="hand minute-hand" id="minuteHand"></div>
          <div class="hand second-hand" id="secondHand"></div>
          <div class="clock-center"></div>
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
