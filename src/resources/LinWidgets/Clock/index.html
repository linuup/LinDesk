<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Lin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget">
    <div class="glass-panel">
      <!-- Header -->
      <header class="header">
        <div class="label">Clock Lin</div>
        <button type="button" id="themeToggle" class="theme-toggle" title="切换主题">☀️</button>
      </header>
      
      <!-- Main Content -->
      <section class="main-clock">
        <div class="time-block">
          <div class="time-container">
            <div id="time-main" class="time-main">00:00</div>
            <div class="time-sub">
              <span id="time-sec" class="time-sec">:00</span>
              <span id="time-ampm" class="time-ampm"></span>
            </div>
          </div>
          <div class="date">
            <span id="date-full" class="date-full">Loading</span>
            <span id="date-short" class="date-short"></span>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
