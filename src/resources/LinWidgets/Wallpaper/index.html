<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinDesk Dynamic Wallpaper</title>
  <link rel="stylesheet" href="wallpaper.css">
</head>
<body>
  <div id="wallpaper-container">
    <canvas id="bg-canvas"></canvas>
    <video id="bg-video" autoplay loop muted playsinline></video>

    <!-- 浮动设置微胶囊（鼠标悬停展开，提供选媒体与重置功能） -->
    <div class="control-badge" id="control-badge">
      <span class="status-pill" id="status-text">Aurora Particles</span>
      <button class="btn-pill primary" id="btn-select">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        选择媒体
      </button>
      <button class="btn-pill" id="btn-reset" title="恢复内置极光粒子特效">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        重置
      </button>
    </div>
  </div>

  <script src="wallpaper.js"></script>
</body>
</html>
