<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LinWidget API Tester</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font:12px/1.4 "Segoe UI",sans-serif;background:#ffffff;color:#1e293b;overflow:hidden;display:flex;flex-direction:column;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.titlebar{height:32px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 10px;gap:8px;-webkit-app-region:drag;flex-shrink:0}
.titlebar span{font-weight:700;font-size:12px;color:#475569;letter-spacing:.3px}
.titlebar .iid{font-size:10px;color:#94a3b8;font-family:monospace;-webkit-app-region:no-drag;background:#f1f5f9;padding:1px 6px;border-radius:4px}
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:180px;flex-shrink:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:3px;border-right:1px solid #e2e8f0;background:#f8fafc}
.group-label{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;padding:8px 6px 3px}
.btn{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #e2e8f0;background:#ffffff;color:#374151;font:11px "Segoe UI",sans-serif;cursor:pointer;text-align:left;transition:background .12s,border-color .12s;-webkit-app-region:no-drag}
.btn:hover{background:#f1f5f9;border-color:#cbd5e1;color:#1e293b}
.btn:active{background:#e2e8f0}
.btn.danger{border-color:#fecaca;color:#dc2626;background:#fff5f5}
.btn.danger:hover{background:#fee2e2;border-color:#fca5a5}
.btn.accent{border-color:#bfdbfe;color:#2563eb;background:#eff6ff}
.btn.accent:hover{background:#dbeafe;border-color:#93c5fd}
.log-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.log-toolbar{display:flex;align-items:center;padding:5px 10px;gap:6px;border-bottom:1px solid #e2e8f0;flex-shrink:0;background:#f8fafc}
.log-toolbar span{font-size:11px;color:#94a3b8;flex:1}
.log-toolbar button{padding:3px 10px;border-radius:5px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font:11px "Segoe UI",sans-serif;cursor:pointer;-webkit-app-region:no-drag;transition:background .12s}
.log-toolbar button:hover{background:#f1f5f9;color:#374151}
#logArea{flex:1;overflow-y:auto;padding:6px 10px;font:11px/1.7 Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#ffffff}
#logArea .e-info{color:#0369a1}
#logArea .e-ok{color:#16a34a}
#logArea .e-err{color:#dc2626}
#logArea .e-warn{color:#d97706}
#logArea .e-data{color:#7c3aed}
#logArea .e-dim{color:#94a3b8}
#logArea .e-head{color:#0f172a;font-weight:700}
</style>
</head>
<body>
<div class="titlebar">
  <span>🧪 API Tester</span>
  <span class="iid" id="titleId">—</span>
</div>
<div class="body">
  <div class="sidebar">
    <div class="group-label">Identity</div>
    <button class="btn" id="t-identity">Print Identity</button>

    <div class="group-label">Host</div>
    <button class="btn" id="t-resize">resizeWidget(500×640)</button>
    <button class="btn" id="t-geometry">setWidgetGeometry</button>
    <button class="btn" id="t-resize-show">setResizeUiVisible(true)</button>
    <button class="btn" id="t-resize-hide">setResizeUiVisible(false)</button>
    <button class="btn" id="t-settings">openSettings()</button>

    <div class="group-label">Multi Instance</div>
    <button class="btn accent" id="t-create">instances.create()</button>
    <button class="btn" id="t-list">instances.list()</button>
    <button class="btn" id="t-inst-close">instances.close()</button>
    <button class="btn danger" id="t-inst-remove">instances.remove()</button>
    <button class="btn danger" id="t-instances-close">instances.close() alias</button>

    <div class="group-label">Storage · Instance</div>
    <button class="btn" id="t-iset">instance.set(key,val)</button>
    <button class="btn" id="t-iget">instance.get(key)</button>
    <button class="btn" id="t-iremove">instance.remove(key)</button>
    <button class="btn danger" id="t-iclear">instance.clear()</button>

    <div class="group-label">Storage · Widget</div>
    <button class="btn" id="t-wset">widget.set(key,val)</button>
    <button class="btn" id="t-wget">widget.get(key)</button>
    <button class="btn" id="t-wall">widget.all()</button>
    <button class="btn danger" id="t-wremove">widget.remove(key)</button>

    <div class="group-label">System Info</div>
    <button class="btn" id="t-snapshot">getSnapshot()</button>
    <button class="btn" id="t-cpu">cpu()</button>
    <button class="btn" id="t-gpu">gpu()</button>
    <button class="btn" id="t-mem">memory()</button>
    <button class="btn" id="t-disk">disk()</button>
    <button class="btn" id="t-net">network()</button>
    <button class="btn" id="t-bat">battery()</button>
    <button class="btn" id="t-os">os()</button>
    <button class="btn" id="t-uptime">uptime()</button>
    <button class="btn accent" id="t-watch">watch(1000ms)</button>
    <button class="btn" id="t-unwatch">unwatch()</button>

    <div class="group-label">Network</div>
    <button class="btn" id="t-fetch">fetch(github API)</button>

    <div class="group-label">localStorage</div>
    <button class="btn" id="t-ls-set">ls.setItem</button>
    <button class="btn" id="t-ls-get">ls.getItem</button>
    <button class="btn danger" id="t-ls-clear">ls.clear</button>
  </div>

  <div class="log-panel">
    <div class="log-toolbar">
      <span id="logCount">0 entries</span>
      <button id="btnCopy">Copy</button>
      <button id="btnClear">Clear</button>
    </div>
    <div id="logArea"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
