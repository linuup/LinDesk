<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="widget">
    <div class="glass-panel">
      <div class="header">Daily Hydration</div>
      <div class="water-container">
        <div class="cup" id="cupElement">
          <div class="water-fill" id="waterFill">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div id="bubblesContainer" style="position: absolute; width: 100%; height: 100%; bottom: 0; left: 0;"></div>
          </div>
          <div class="cup-face" id="cupFace">
            <div class="eye left"></div>
            <div class="mouth"></div>
            <div class="eye right"></div>
          </div>
        </div>
        <div class="stats">
          <div class="percent font-mono" id="percentAmount">0%</div>
          <div class="amount font-mono"><span id="currentAmount">0</span> <small>/ 2000 ml</small></div>
        </div>
      </div>
      <div class="actions">
        <button id="addBtn" class="btn" title="Add 250ml">💧 Drink!</button>
        <button id="resetBtn" class="btn btn-icon" title="Reset Today">↺</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
