<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinWidget Settings Host</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <iframe id="settingsFrame" title="LinWidget settings"></iframe>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const src = params.get('src') || 'about:blank';
      const frame = document.getElementById('settingsFrame');
      frame.src = src;
      window.addEventListener('message', event => {
        try {
          if (window.chrome && chrome.webview && event.data) {
            chrome.webview.postMessage(event.data);
          }
        } catch (_) {
        }
      });
    })();
  </script>
</body>
</html>
