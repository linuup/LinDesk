# ==============================================================================
# LinDesk 发版与打包自动化配置模板 (release_config.template.ini)
#
# 【查找规则】
# 1. 优先读取本配置文件 (release_config.ini) 中的配置项；
# 2. 若未配置或为空，自动读取系统环境变量；
# 3. 若均未配置或对应路径不存在，脚本将直接输出提示并终止运行，不会继续执行下一步。
#
# 【使用方法】
# 复制本文件并重命名为 release_config.ini，按需填写本地路径与凭据。
# release_config.ini 已被 .gitignore 忽略，不会提交到代码仓库。
# ==============================================================================

[github]
# GitHub 个人访问令牌 (PAT，需具备目标发布仓库 Contents 的 Read & Write 权限)
# 备选环境变量: GITHUB_TOKEN
token = YOUR_GITHUB_PERSONAL_ACCESS_TOKEN_HERE

# 目标仓库信息 (选填，默认 linuup / LinDesk)
# repo_owner = linuup
# repo_name = LinDesk

[tools]
# vcpkg 根目录 (目录下应包含 scripts/buildsystems/vcpkg.cmake)
# 备选环境变量: VCPKG_ROOT 或 CMAKE_TOOLCHAIN_FILE
vcpkg_root = 

# Inno Setup 6 安装目录 (包含 ISCC.exe) 或 ISCC.exe 文件完整路径
# 备选环境变量: INNO_SETUP_DIR 或系统 PATH 中包含 iscc / ISCC.exe
inno_setup_dir = 

# Qt 5.15.2 (MSVC 2019 64位) 根目录 (包含 bin/windeployqt.exe)
# 备选环境变量: QTDIR_X64 (或 QTDIR)
qt_dir_x64 = 

# Qt 5.15.2 (MSVC 2019 32位) 根目录 (包含 bin/windeployqt.exe)
# 备选环境变量: QTDIR_X86 (或 QTDIR)
qt_dir_x86 = 
