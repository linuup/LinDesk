<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinDesk Widgets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect x='5.5' y='5.5' width='10' height='10' rx='2.5' fill='%238b5cf6'/%3E%3Crect x='5.5' y='20.5' width='10' height='10' rx='2.5' fill='none' stroke='%231e293b' stroke-width='1.5'/%3E%3Crect x='20.5' y='5.5' width='10' height='10' rx='2.5' fill='none' stroke='%231e293b' stroke-width='1.5'/%3E%3Crect x='20.5' y='20.5' width='10' height='10' rx='2.5' fill='none' stroke='%231e293b' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* 空状态材料卡片：Apple 风 ultraThin 毛玻璃，克制无装饰 */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 44px 64px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
      animation: fadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: rgba(30, 41, 59, 0.55);
      margin-bottom: 14px;
    }

    .icon {
      width: 36px;
      height: 36px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.2;
      color: #1e293b;
      text-align: center;
    }

    p {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1px;
      color: rgba(51, 65, 85, 0.72);
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- 组件系统空状态：无活动组件时居中展示；透明区域穿透桌面，卡片区域拦截交互 -->
  <div class="card">
    <div class="brand">LINWIDGET</div>
    <svg class="icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
      <rect x="5.5" y="5.5" width="10" height="10" rx="2.5" fill="#8b5cf6" />
      <rect x="5.5" y="20.5" width="10" height="10" rx="2.5" stroke="rgba(30,41,59,0.5)" stroke-width="1.5" />
      <rect x="20.5" y="5.5" width="10" height="10" rx="2.5" stroke="rgba(30,41,59,0.5)" stroke-width="1.5" />
      <rect x="20.5" y="20.5" width="10" height="10" rx="2.5" stroke="rgba(30,41,59,0.5)" stroke-width="1.5" />
    </svg>
    <h1>没有正在运行的组件</h1>
    <p>在设置中启用组件，它们会出现在你的桌面上</p>
  </div>
</body>

</html>
