<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Universe Wallpaper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen WebGL/Canvas Background -->
  <canvas id="wallpaper-canvas"></canvas>
  
  <!-- Interactive Ambient HUD Layer (Hidden by default, can be toggled via JS) -->
  <div id="hud-overlay">
    <div class="clock-container">
      <div id="clock-time">00:00</div>
      <div id="clock-date">LOADING SPACE</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
