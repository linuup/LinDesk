<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysMonitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget">
    <div class="glass-panel">
      <!-- Ambient Glow -->
      <div class="ambient-glow"></div>

      <!-- Style Switcher (Right aligned) -->
      <div class="style-switcher">
        <button class="style-dot active" data-style="1" title="Overview"></button>
        <button class="style-dot" data-style="2" title="CPU/Memory Details"></button>
        <button class="style-dot" data-style="3" title="Disk Details"></button>
        <button class="style-dot" data-style="4" title="Network Details"></button>
      </div>

      <div class="panels-wrapper">
        <!-- Panel 1: Overview -->
        <div id="panelStyle1" class="panel-section active">


      <!-- CPU & RAM Rings -->
      <section class="rings-container">
        <!-- CPU Ring -->
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="cpuRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="cpuValue">0<span class="percent">%</span></div>
            <div class="ring-label">CPU</div>
          </div>
          <div class="ring-detail" id="cpuDetail">... Cores</div>
        </div>

        <!-- RAM Ring -->
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="ramRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="ramValue">0<span class="percent">%</span></div>
            <div class="ring-label">RAM</div>
          </div>
          <div class="ring-detail" id="ramDetail">0 / 0 GB</div>
        </div>
      </section>

      <!-- Disk & Battery -->
      <section class="status-container">
        <!-- GPU -->
        <div class="status-card">
          <div class="status-header">
            <span class="label">GPU <span id="gpuVramLabel" class="sub-label" style="display:none;"></span></span>
            <span class="value font-mono" id="gpuValue">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="gpuBar" style="width: 0%; background: var(--accent-purple);"></div>
          </div>
          <div class="status-footer" id="gpuName" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;" title="">...</div>
        </div>
        <!-- Battery -->
        <div class="status-card">
          <div class="status-header">
            <span class="label">POWER <svg id="chargeIcon" class="charge-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></span>
            <span class="value font-mono" id="batValue">...</span>
          </div>
          <div class="battery-icon">
            <div class="battery-body">
              <div class="battery-level" id="batBar"></div>
            </div>
            <div class="battery-tip"></div>
          </div>
          <div class="status-footer" id="batDetail">...</div>
        </div>
      </section>

      <!-- Network -->
      <section class="network-container">
        <div class="net-header">NETWORK LIVE</div>
        <div class="net-stats">
          <div class="net-stat">
            <svg class="icon-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            <span class="font-mono" id="netDown">0 KB/s</span>
          </div>
          <div class="net-stat">
            <svg class="icon-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            <span class="font-mono" id="netUp">0 KB/s</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="netCanvas"></canvas>
        </div>
      </section>
        </div><!-- End Panel 1 -->

        <!-- Panel 2: CPU / Memory Details -->
        <div id="panelStyle2" class="panel-section">
          <div class="detail-header">CPU Details</div>
          <div class="detail-list" id="cpuDetailList">Loading CPU...</div>
          <div class="detail-header">Memory Details</div>
          <div class="detail-list" id="memDetailList">Loading Memory...</div>
        </div>

        <!-- Panel 3: Disk Details -->
        <div id="panelStyle3" class="panel-section">
          <div class="detail-header">Storage Details</div>
          <div class="detail-list disk-list" id="diskDetailList">Loading Disks...</div>
        </div>

        <!-- Panel 4: Network Details -->
        <div id="panelStyle4" class="panel-section">
          <div class="detail-header">Network Activity</div>
          <div class="detail-list" style="flex: none; display: flex; flex-direction: row; justify-content: space-between; padding: 0.8rem 1rem;">
             <div style="display:flex; flex-direction:column; gap:0.2rem;">
               <span class="detail-label" style="font-size:0.65rem;">Total Download</span>
               <span class="detail-val" id="netTotalDown" style="color:var(--accent-green); text-align:left;">0 B</span>
             </div>
             <div style="display:flex; flex-direction:column; gap:0.2rem;">
               <span class="detail-label" style="font-size:0.65rem;">Total Upload</span>
               <span class="detail-val" id="netTotalUp" style="color:var(--accent-purple); text-align:right;">0 B</span>
             </div>
          </div>
          <div class="network-container" style="flex: 1;">
            <div class="net-stats" style="margin-bottom: 0.8rem;">
              <div class="net-stat">
                <svg class="icon-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                <span class="font-mono" id="netDown2">0 KB/s</span>
              </div>
              <div class="net-stat">
                <svg class="icon-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                <span class="font-mono" id="netUp2">0 KB/s</span>
              </div>
            </div>
            <div class="canvas-wrap">
              <canvas id="netCanvas2"></canvas>
            </div>
          </div>
        </div>
      </div><!-- End panels-wrapper -->

      <!-- Micro Mode (Horizontal 4 rings) -->
      <section class="micro-mode">
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="microCpuRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="microCpuValue">0<span class="percent">%</span></div>
            <div class="ring-label">CPU</div>
          </div>
        </div>
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="microRamRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)" style="stroke: var(--accent-purple);"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="microRamValue">0<span class="percent">%</span></div>
            <div class="ring-label">RAM</div>
          </div>
        </div>
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="microGpuRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="microGpuValue">0<span class="percent">%</span></div>
            <div class="ring-label">GPU</div>
          </div>
        </div>
        <div class="ring-box">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
            <circle class="ring-fill" id="microBatRing" cx="50" cy="50" r="40" transform="rotate(-90 50 50)" style="stroke: var(--accent-green);"></circle>
          </svg>
          <div class="ring-content">
            <div class="ring-value font-mono" id="microBatValue">0<span class="percent">%</span></div>
            <div class="ring-label">BAT</div>
          </div>
        </div>
      </section>

    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
