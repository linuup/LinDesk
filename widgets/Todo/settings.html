<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo Settings</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
      background: #f9f9f9;
      color: #333;
      margin: 0;
    }
    .settings-group {
      margin-bottom: 24px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .settings-group h3 {
      margin-top: 0;
      font-size: 15px;
      color: #555;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8b5cf6;
    }
    .color-options {
      display: flex;
      gap: 14px;
    }
    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s, border-color 0.2s;
    }
    .color-swatch:hover {
      transform: scale(1.1);
    }
    .color-swatch.selected {
      border-color: #333;
      transform: scale(1.1);
    }
    button.action-btn {
      padding: 10px 20px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button.action-btn:hover {
      background: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #ddd; }
      .settings-group { background: #2d2d2d; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
      .settings-group h3 { color: #bbb; border-color: #444; }
      input[type="text"] { background: #333; border-color: #555; color: #fff; }
      input[type="text"]:focus { border-color: #8b5cf6; }
      .color-swatch.selected { border-color: #fff; }
    }
  </style>
</head>
<body>
  <div class="settings-group">
    <h3>基本设置 (Basic Settings)</h3>
    <label for="titleInput">组件标题 (Widget Title)</label>
    <input id="titleInput" type="text" placeholder="例如: Tasks, 工作, 购物清单...">
  </div>

  <div class="settings-group">
    <h3>主题强调色 (Accent Color)</h3>
    <div class="color-options" id="colorOptions">
      <div class="color-swatch" data-color="#8b5cf6" style="background: #8b5cf6;" title="Purple"></div>
      <div class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Blue"></div>
      <div class="color-swatch" data-color="#10b981" style="background: #10b981;" title="Green"></div>
      <div class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Orange"></div>
      <div class="color-swatch" data-color="#ef4444" style="background: #ef4444;" title="Red"></div>
      <div class="color-swatch" data-color="#ec4899" style="background: #ec4899;" title="Pink"></div>
    </div>
  </div>

  <div class="settings-group">
    <h3>数据管理 (Data Management)</h3>
    <button id="clearCompletedBtn" class="action-btn">清除已完成任务 (Clear Completed)</button>
  </div>

  <script>
    const titleInput = document.getElementById("titleInput");
    const colorSwatches = document.querySelectorAll(".color-swatch");
    const clearCompletedBtn = document.getElementById("clearCompletedBtn");

    // Load Settings
    titleInput.value = localStorage.getItem("lindesk_todo_title") || "Tasks";
    const currentAccent = localStorage.getItem("lindesk_todo_accent") || "#8b5cf6";
    
    // Apply accent to settings page dynamically
    function applyAccent(color) {
      document.body.style.setProperty('--accent', color);
      let styleTag = document.getElementById('dynamicAccent');
      if (!styleTag) {
        styleTag = document.createElement('style');
        styleTag.id = 'dynamicAccent';
        document.head.appendChild(styleTag);
      }
      styleTag.textContent = `input[type="text"]:focus { border-color: ${color} !important; }`;
    }
    applyAccent(currentAccent);

    // Init Swatches
    colorSwatches.forEach(swatch => {
      if (swatch.dataset.color === currentAccent) {
        swatch.classList.add('selected');
      }
      swatch.addEventListener('click', () => {
        colorSwatches.forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        localStorage.setItem("lindesk_todo_accent", swatch.dataset.color);
        applyAccent(swatch.dataset.color);
      });
    });

    // Handle Title Change
    titleInput.addEventListener("input", () => {
      localStorage.setItem("lindesk_todo_title", titleInput.value || "Tasks");
    });

    // Handle Clear Completed without blocking alerts
    clearCompletedBtn.addEventListener("click", () => {
      let tasks = JSON.parse(localStorage.getItem('lindesk_todo_tasks')) || [];
      const originalLength = tasks.length;
      tasks = tasks.filter(task => !task.completed);
      
      const originalText = clearCompletedBtn.textContent;
      if (tasks.length < originalLength) {
        localStorage.setItem('lindesk_todo_tasks', JSON.stringify(tasks));
        clearCompletedBtn.textContent = "✓ 已清理 (Cleared)";
        clearCompletedBtn.style.background = "#10b981";
      } else {
        clearCompletedBtn.textContent = "无已完成任务 (None)";
        clearCompletedBtn.style.background = "#888";
      }
      
      setTimeout(() => {
        clearCompletedBtn.textContent = originalText;
        clearCompletedBtn.style.background = "";
      }, 2000);
    });
  </script>
</body>
</html>
