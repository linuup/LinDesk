<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinDesk 动态壁纸本地预览沙箱 · Wallpaper Preview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f19'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2338bdf8' opacity='0.7'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      position: relative;
    }

    /* 全屏壁纸嵌入 iframe */
    iframe#wallpaperFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 1;
    }

    /* 悬浮在壁纸上方的极简控制条 (鼠标移上时显现) */
    .floating-bar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      height: 42px;
      padding: 0 16px;
      border-radius: 9999px;
      background: rgba(18, 20, 28, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .floating-bar:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(2px);
    }

    .bar-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bar-title .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    select, button {
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    select {
      background: #141722;
    }

    select:focus, button:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(56, 189, 248, 0.5);
    }

    /* 底部提示胶囊 */
    .hint-capsule {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 14px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 100;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>

  <div class="floating-bar">
    <div class="bar-title">
      <span class="dot"></span>
      <span>全屏动态壁纸沙箱</span>
    </div>

    <!-- 壁纸选择 -->
    <select id="wallpaperSelector" onchange="switchWallpaper(this.value)">
      <option value="living_wallpaper">深空流体壁纸 (living_wallpaper)</option>
      <option value="neon_universe">赛博星系壁纸 (neon_universe)</option>
    </select>

    <button onclick="reloadWallpaper()">
      刷新 (F5)
    </button>
  </div>

  <iframe id="wallpaperFrame" src="living_wallpaper/index.html"></iframe>

  <div class="hint-capsule">
    在屏幕上随意移动鼠标，即可实时测试动态壁纸的粒子引力、视差与流光互动效果
  </div>

  <script>
    const frame = document.getElementById('wallpaperFrame');

    function switchWallpaper(folder) {
      frame.src = folder + '/index.html';
    }

    function reloadWallpaper() {
      frame.contentWindow.location.reload();
    }
  </script>
</body>

</html>
